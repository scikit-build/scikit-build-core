ci:
  autoupdate_commit_msg: "chore(deps): update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"
  autoupdate_schedule: monthly

exclude: ^src/scikit_build_core/_vendor

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
        exclude: "^tests/packages/|^tests/utils"
      - id: trailing-whitespace
        exclude: "^tests"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 321478e58f4938179c6b86e4ddfa923d1547a49b # frozen: v0.16.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/henryiii/flake8-lazy
    rev: 3b5e52593dfaec56e6e4a48f237bafcf3d0b83ea # frozen: v0.9.0
    hooks:
      - id: flake8-lazy
        files: ^src/
        args: [--apply=set, --strict-typing]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316 # frozen: v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/adamchainz/blacken-docs
    rev: dda8db18cfc68df532abf33b185ecd12d5b7b326 # frozen: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==25.*]

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: e2c2116d86a80e72e7146a06e68b7c228afc6319 # frozen: v0.6.13
    hooks:
      - id: cmake-format
        exclude: ^src/scikit_build_core/resources/find_python

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "0ee178619d696787ca73d210cc191d720868c631" # frozen: v3.9.6
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]
        args: [--prose-wrap=always]
        exclude: "^tests|src/scikit_build_core/resources/scikit-build.schema.json|^docs/projects.md|^docs/_templates/"

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee # frozen: v2.3.1
    hooks:
      - id: mypy
        exclude: |
          (?x)^(
            tests/packages/simplest_c/src/simplest/__init__.py|
            tests/packages/dynamic_metadata/src/dynamic/__init__.py|
            tests/packages/.*/setup.py
          )
        files: ^(src|tests|noxfile.py)
        args: ["--python-version=3.10"]
        additional_dependencies:
          - build<1.5 # Requires Python 3.10+
          - cattrs<26.1 # Requires Python 3.10+
          - cmake
          - exceptiongroup
          - hatch-fancy-pypi-readme>=23.2
          - ninja
          - nox
          - packaging>=24.2
          - pathspec>=1.1
          - pytest<9 # pytest 9 requires Python 3.10+
          - pytest-subprocess
          - rich
          - setuptools-scm>=10.1 # 10.1 pulls in typed vcs-versioning>=2.0
          - tomli
          - types-setuptools>=80.9

  - repo: https://github.com/henryiii/check-sdist
    rev: "5230295f53448dcfc8cc4a9eb00cc776ca92f964" # frozen: v1.6.0
    hooks:
      - id: check-sdist
        args: [--inject-junk]
        additional_dependencies:
          - hatchling
          - hatch-vcs

  - repo: https://github.com/crate-ci/typos
    rev: c132f8b9e3ac7f8f0625490b1cb5b906d1d6a63a # frozen: v1
    hooks:
      - id: typos
        args: []
        exclude: ^(LICENSE$|src/scikit_build_core/resources/find_python|tests/test_skbuild_settings.py$)

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229 # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: disallow-caps
        name: Disallow improper capitalization
        language: pygrep
        entry: PyBind|Numpy|Cmake|CCache|Github|PyTest
        exclude: .pre-commit-config.yaml
      - id: disallow-emdash
        name: Use multiple dashes instead of emdash
        language: pygrep
        entry: —
        files: ^(docs|src|tests|README.md)
      - id: disallow-expressions
        name: Disallow expressions
        language: pygrep
        entry: tool\.cmake
        exclude: .pre-commit-config.yaml
      - id: cog
        name: Cog the documentation
        files: docs/.*/projects\.
        entry: cog -r -c
        args: [docs/about/projects.md]
        pass_filenames: false
        language: python
        additional_dependencies: ["cogapp>=3.5"]

  - repo: https://github.com/henryiii/validate-pyproject-schema-store
    rev: 0cee1769d7b9f642b7545be04c079f94277d6833 # frozen: 2026.09.04
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: c4654a7e007c9619a5eb63c39a456572a0fa1851 # frozen: 0.38.0
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-readthedocs
      - id: check-metaschema
        files: \.schema\.json

  - repo: https://github.com/citation-file-format/cffconvert
    rev: b6045d78aac9e02b039703b030588d54d53262ac
    hooks:
      - id: validate-cff

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: cef8b8350da46d8114c7e6b7272aebdccdf193ce # frozen: v1.30.0
    hooks:
      - id: zizmor
        files: "^\\.github"
        args: [--persona=pedantic]

  - repo: https://github.com/scientific-python/cookie
    rev: 1589a99867d6cac494ac7545fe6a83108580a3ee # frozen: 2026.08.14
    hooks:
      - id: sp-repo-review
